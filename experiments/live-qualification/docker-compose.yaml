name: societyer-live-qualification
services:
  backend:
    image: ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
    ports:
      - "127.0.0.1:43230:3210"
      - "127.0.0.1:43231:3211"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      INSTANCE_NAME: societyer-live-qualification
      INSTANCE_SECRET: ${QUALIFICATION_INSTANCE_SECRET:?Run npm start first}
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:43230
      CONVEX_SITE_ORIGIN: http://127.0.0.1:43231
      DISABLE_BEACON: "true"
      NO_PROXY: ${NO_PROXY:-},host.docker.internal,127.0.0.1,localhost
      no_proxy: ${NO_PROXY:-},host.docker.internal,127.0.0.1,localhost
    volumes:
      - qualification-convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3210/version"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_signal: SIGINT
    stop_grace_period: 10s
volumes:
  qualification-convex-data:
