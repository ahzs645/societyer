name: societyer-offline-pilot
services:
  backend:
    # Resolved from the official image on 2026-10-04; avoid a moving latest tag.
    image: ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
    ports:
      - "127.0.0.1:43210:3210"
      - "127.0.0.1:43211:3211"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      INSTANCE_NAME: societyer-offline-pilot
      INSTANCE_SECRET: ${PILOT_INSTANCE_SECRET:?Run npm run local:start first}
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:43210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:43211
      DISABLE_BEACON: "true"
      # Public traffic retains the runtime proxy; this JWKS is on this machine.
      NO_PROXY: ${NO_PROXY:-},host.docker.internal,127.0.0.1,localhost
      no_proxy: ${NO_PROXY:-},host.docker.internal,127.0.0.1,localhost
    volumes:
      - pilot-convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3210/version"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_signal: SIGINT
    stop_grace_period: 10s
volumes:
  pilot-convex-data:
