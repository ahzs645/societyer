<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Procurement analytical contract fixture</title></head><body><div id="root"></div><script type="module">

import '/src/styles/index.scss';
