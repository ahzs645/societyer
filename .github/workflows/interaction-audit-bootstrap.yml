name: Interaction audit bootstrap
on:
  push:
    branches: [fix/interaction-audit-2026-10-31]
    paths: [.github/workflows/interaction-audit-bootstrap.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: git archive --format=tar.gz --output=/tmp/societyer-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: interaction-audit-source
          path: /tmp/societyer-source.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive dependencies for network-isolated verification
        run: tar -czf /tmp/societyer-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: interaction-audit-dependencies
          path: /tmp/societyer-node-modules.tar.gz
          compression-level: 0
          retention-days: 3
