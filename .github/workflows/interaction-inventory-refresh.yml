name: Refresh reviewed interaction inventory
on:
  push:
    branches: [fix/interaction-audit-2026-10-31]
    paths: [.github/workflows/interaction-inventory-refresh.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/interaction-audit-2026-10-31'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply the two reviewed inventory entries
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path('scripts/stage2/function-inventory.json')
          old = path.read_bytes()
          assert hashlib.sha256(old).hexdigest() == '8477b24c785b1df415770ace49eb514ead9a48851e41ce5c8762bba35445d7a0'
          rows = json.loads(old)
          changed = 0
          for row in rows:
              if row['key'] not in ('convex:meetings:create', 'portable:meetings:create'): continue
              assert row['idArguments'][0]['path'] == 'societyId'
              row['idArguments'][1:1] = [
                  {'path': 'followUp.sourceMeetingId', 'table': 'meetings', 'array': False, 'optional': True},
                  {'path': 'followUp.sourceMinutesId', 'table': 'minutes', 'array': False, 'optional': True},
              ]
              changed += 1
          new = (json.dumps(rows, indent=2) + '\n').encode()
          assert changed == 2 and hashlib.sha256(new).hexdigest() == '400c73ec135df00cbb916e3f1671feef7cb1c9e8c73e516c94c1d68f0fb1d129'
          path.write_bytes(new)
          PY
          git diff --check
          git add -- scripts/stage2/function-inventory.json
      - name: Commit only to the unchanged repair branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          branch=fix/interaction-audit-2026-10-31
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh security inventory for atomic follow-up source identifiers'
          git push origin "HEAD:refs/heads/$branch"
