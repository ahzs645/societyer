name: Organization and tax guidance

on:
  pull_request:
    paths:
      - "package*.json"
      - "tsconfig*.json"
      - "shared/tax/**"
      - "shared/*Tax*"
      - "shared/*tax*"
      - "shared/*entity*"
      - "shared/*Entity*"
      - "shared/invoicing.ts"
      - "shared/gstAccountReference.ts"
      - "shared/invoiceLedger.ts"
      - "shared/functions/invoiceLedger.ts"
      - "shared/functions/receiptRetention.ts"
      - "shared/functions/invoices.ts"
      - "shared/functions/organizationDetails.ts"
      - "shared/functions/billingDocuments.ts"
      - "shared/orgHubOptions.ts"
      - "shared/organizationCapabilities.ts"
      - "shared/functions/billingAutomation.ts"
      - "convex/invoices.ts"
      - "convex/lib/renderBillingDocument.ts"
      - "convex/organizationDetails.ts"
      - "convex/tables/invoices.ts"
      - "convex/validators/*Tax*.ts"
      - "convex/validators/taxAssessment.ts"
      - "src/features/invoicing/**"
      - "src/pages/Society.tsx"
      - "src/pages/Invoices.tsx"
      - "src/pages/Filings.tsx"
      - "src/pages/OrganizationSetup.tsx"
      - "src/components/OrganizationCapabilities.tsx"
      - "src/components/organizationCapabilities.css"
      - "src/components/GstAccountReference.tsx"
      - "scripts/check-tax-*"
      - "scripts/check-invoice-tax-*"
      - "scripts/check-invoice-lifecycle*"
      - "scripts/check-invoice-logo-retention.ts"
      - "scripts/check-gst-account-reference.tsx"
      - "scripts/check-organization-capabilities.ts"
      - "scripts/check-entity-*"
      - "tests/tax-guidance.spec.ts"
      - "playwright.tax-guidance.config.ts"
      - "tests/invoice-lifecycle.spec.ts"
      - "playwright.invoice-lifecycle.config.ts"
      - "tests/gst-account-reference.spec.ts"
      - "playwright.gst-account.config.ts"
      - ".github/workflows/entity-tax-guidance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tax-guidance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Entity coverage, tax rules, persistence and document rendering
        run: npm run test:organization-capabilities && npm run test:tax-guidance
      - name: Existing invoice behavior
        run: npm run test:invoices && npm run test:invoice-money && npm run test:billing-documents && npm run test:billing-operations && npm run test:billing-automation
      - name: App and hosted schema typechecks
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit && npm run convex:typecheck
      - name: Install browser
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: Desktop and phone tax decisions
        if: ${{ !cancelled() }}
        run: npm run test:tax-guidance-ui
      - name: Manual invoice lifecycle on desktop and phone
        if: ${{ !cancelled() }}
        run: npm run test:invoice-lifecycle-ui
      - name: Organization GST account and filing reference on desktop and phone
        if: ${{ !cancelled() }}
        run: npm run test:gst-account-ui
      - name: PDF export options on desktop and phone
        if: ${{ !cancelled() }}
        run: npm run test:invoice-preview-controls-ui
      - name: Existing catalog and customer flows
        if: ${{ !cancelled() }}
        run: npm run test:invoice-catalog-customers-ui
      - name: Browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tax-guidance-browser-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
