name: Apply verified interaction repair
on:
  push:
    branches: [fix/interaction-audit-2026-10-31]
    paths: [.github/workflows/interaction-audit-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/interaction-audit-2026-10-31'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply exact reviewed source changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          encoded = ''.join((root / f'.interaction-repair/part-{i}.b64').read_text().strip() for i in range(7))
          decoder = lzma.LZMADecompressor()
          raw = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=10_000_000)
          assert decoder.eof and not decoder.unused_data, 'Incomplete or oversized payload'
          assert hashlib.sha256(raw).hexdigest() == '7cc08a0c308ffce4d6c278c851256c597bd2fbe90688b0a41a0c00ca68fe96af', 'Payload integrity failed'
          changes = json.loads(raw)
          assert isinstance(changes, list) and len(changes) == 57
          prepared = {}
          for change in changes:
              path = pathlib.PurePosixPath(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts and path.parts[0] not in ('.git', '.github', '.interaction-repair')
              assert str(path) not in prepared
              target = root / path
              assert all(not p.is_symlink() for p in [target, *target.parents]), 'Symlink not allowed'
              old = target.read_bytes() if target.exists() else b''
              before = change['before']
              assert (hashlib.sha256(old).hexdigest() == before) if before is not None else not target.exists(), f'Baseline changed: {path}'
              cursor = 0
              pieces = []
              for start, end, replacement in change['edits']:
                  assert isinstance(start, int) and isinstance(end, int) and cursor <= start <= end <= len(old)
                  pieces.extend([old[cursor:start], replacement.encode('utf-8')])
                  cursor = end
              pieces.append(old[cursor:])
              new = b''.join(pieces)
              assert hashlib.sha256(new).hexdigest() == change['after'], f'Result integrity failed: {path}'
              prepared[str(path)] = new
          for name, content in prepared.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          subprocess.run(['git', 'add', '--', *prepared], check=True)
          subprocess.run(['git', 'rm', '-r', '--', '.interaction-repair'], check=True)
          print(f'Applied and verified {len(prepared)} files; removed transport data.')
          PY
          git diff --cached --check
      - name: Commit only to the expected feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          branch=fix/interaction-audit-2026-10-31
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix audited interactions, data preservation, exports and runtime parity'
          git push origin "HEAD:refs/heads/$branch"
