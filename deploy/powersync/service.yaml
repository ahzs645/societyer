# Production meeting-preparation stream only. Pins the qualified Convex connector release.
_type: self-hosted
telemetry:
  disable_telemetry_sharing: true
replication:
  connections:
    - type: convex
      deployment_url: !env PS_CONVEX_DEPLOYMENT_URL
      deploy_key: !env PS_CONVEX_DEPLOY_KEY
      polling_interval_ms: 1000
      request_timeout_ms: 60000
storage:
  type: postgresql
  # URI query flags do not enable verified TLS in this service; explicit setting is required.
  sslmode: verify-full
  uri: !env PS_STORAGE_URI
sync_config:
  path: /config/sync-config.yaml
client_auth:
  jwks_uri: !env PS_JWKS_URL
  audience:
    - !env PS_PUBLIC_ORIGIN
