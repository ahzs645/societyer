server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The OAuth consent page takes a decision, so no other site may frame it
  # (clickjacking). The app's CSP is a meta tag, which can't set
  # frame-ancestors, so these must be response headers. Mirrors public/_headers.
  # strict-origin, not no-referrer: the consent page's completion POST must
  # carry its Origin, which no-referrer turns into "null".
  # index.html is served from this location (a file argument, not try_files'
  # fallback URI, which would redirect internally to `/` and drop the headers).
  location /oauth/ {
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin" always;
    try_files /index.html =404;
  }
}
